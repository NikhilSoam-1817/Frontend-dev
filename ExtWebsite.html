<!DOCTYPE html>
<!-- External Website Embed Page -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed External Website</title>
  </head>
  <body>
    <h1>Embedded Website Example</h1>

    <!-- Iframe embedding Wikipedia -->
    <iframe 
      src="https://www.wikipedia.org" 
      title="Wikipedia" 
      width="80%" 
      height="500px" 
      style="border:1px solid #000;"
      loading="lazy">
    </iframe>

    <!-- Note about embedding restrictions -->
    <p>Some websites may not allow embedding for security reasons.</p>
  </body>
</html>
