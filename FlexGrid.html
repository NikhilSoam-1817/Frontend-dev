<!DOCTYPE html>

  <title>Q10 Combined Layout</title>
  <link rel="stylesheet" href="FlexGrid.css">
</head>
<body>

  <header class="header">
    <div class="logo">MyLogo</div>

      <a href="#">Blog</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="main-container">
