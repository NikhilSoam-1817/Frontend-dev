<!DOCTYPE html>
<!-- URI Encoding Example Page -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding Example</title>
  </head>
  <body>
    <h1>URI Encoding Demonstration</h1>

    <p>
      Original URL with spaces and special characters:
      <a href="https://example.com/search?query=HTML & CSS">https://example.com/search?query=HTML & CSS</a>
    </p>

    <p>
      Correctly encoded URL using %20 for spaces:
      <a href="https://example.com/search?query=HTML%20%26%20CSS">
        https://example.com/search?query=HTML%20%26%20CSS
      </a>
    </p>

    <p>
      Notes:  
      - Spaces are replaced by <code>%20</code><br>
      - The ampersand (&) is replaced by <code>%26</code>
    </p>
  </body>
</html>
