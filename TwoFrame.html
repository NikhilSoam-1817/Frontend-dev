<!DOCTYPE html>
<!-- Two Iframes Page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Iframes Page</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Welcome to My Iframes Showcase</h1>
      <p>Below are two pages embedded using iframes.</p>
    </header>

    <!-- First Iframe: Introduction Page -->
    <section>
      <h2>Introduction Page</h2>
      <iframe 
        src="GoogleMap.html" 
        title="Introduction Page" 
        width="80%" 
        height="300px" 
        style="border:1px solid #000;">
      </iframe>
    </section>

    <!-- Second Iframe: Hobby Page -->
    <section>
      <h2>My Favorite Hobby Page</h2>
      <iframe 
        src="YouTube.html" 
        title="Hobby Page" 
        width="80%" 
        height="300px" 
        style="border:1px solid #000;">
      </iframe>
    </section>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 My Iframes Showcase. All rights reserved.</p>
    </footer>
  </body>
</html>
