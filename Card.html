<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip - Q9</title>
  <link rel="stylesheet" href="Card.css">
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="front">
        <img src="https://via.placeholder.com/250" alt="Front Image">
        <h2>Card Title</h2>
      </div>
      <div class="back">
        <p>
          This is the back side of the card containing a short description.
          Hover to flip!
        </p>
      </div>
    </div>
  </div>

</body>
</html>
