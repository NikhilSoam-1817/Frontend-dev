<!DOCTYPE html>
<!-- Google Map Embed Page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My City Map</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Map of My City</h1>
    </header>

    <!-- Embedded Google Map -->
    <main>
      <p>Here is the map showing my city location:</p>
      <!-- 
        The loading="lazy" attribute defers loading the map until it is needed, 
        which improves page loading performance.
      -->
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3783.923456789123!2d73.85745531523712!3d18.520430587394716!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bf2f1d1c8e3d%3A0xabcdef123456789!2sPune%2C%20Maharashtra%2C%20India!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" 
        title="Map showing Pune, Maharashtra, India" 
        width="80%" 
        height="50%" 
        style="border:0;" 
        allowfullscreen 
        loading="lazy">
      </iframe>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 My City Maps. All rights reserved.</p>
    </footer>
  </body>
</html>
